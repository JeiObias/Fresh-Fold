<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Fresh Fold</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="font-[Poppins] min-h-screen flex items-center justify-center px-5 py-10 overflow-x-hidden relative">

    <!-- Background Image -->
    <div class="absolute inset-0 -z-20">
        <img
            src="images/washing-machine.jpg"
            alt="Laundry Background"
            class="w-full h-full object-cover">
    </div>

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-slate-900/40 -z-10"></div>

    <!-- Signup Card -->
    <div class="relative z-10 w-full max-w-md">

        <div class="bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl rounded-3xl p-8">

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="w-24 h-24 rounded-full bg-white p-2 shadow-2xl border-4 border-blue-400">
                    <img
                        src="images/laundry-logo.jpg"
                        alt="Laundry Management System Logo"
                        class="w-full h-full rounded-full object-cover">
                </div>
            </div>

            <h1 class="text-3xl font-bold text-center text-slate-800">
                Create Account
            </h1>

            <p class="text-center text-slate-500 mt-2 mb-8">
                Sign up for Fresh Fold.
            </p>

            <form id="signupForm">

                <!-- Full Name -->
                <div class="mb-4">
                    <label class="block mb-2 text-slate-700 font-medium">Full Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="fullName"
                            type="text"
                            placeholder="Enter your full name"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="fullNameError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Username -->
                <div class="mb-4">
                    <label class="block mb-2 text-slate-700 font-medium">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="username"
                            type="text"
                            placeholder="Choose a username"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="usernameError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="block mb-2 text-slate-700 font-medium">Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="email"
                            type="email"
                            placeholder="Enter your email"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="emailError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block mb-2 text-slate-700 font-medium">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="password"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Confirm Password -->
                <div class="mb-5">
                    <label class="block mb-2 text-slate-700 font-medium">Confirm Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="confirmPasswordError" class="text-red-500 text-sm mt-1"></p>
                </div>

                <p id="generalError" class="text-red-500 text-sm mb-4"></p>
                <p id="generalSuccess" class="text-green-600 text-sm mb-4"></p>

                <!-- Button -->
                <button
                    id="signupBtn"
                    type="submit"
                    class="w-full py-3 rounded-xl bg-linear-to-r from-cyan-500 to-blue-600 text-white font-semibold hover:scale-105 hover:shadow-xl duration-300">
                    Create Account
                </button>

            </form>

            <!-- Footer -->
            <div class="mt-6 text-center text-slate-600 text-sm">
                Already have an account?
                <a href="index.html" class="text-cyan-600 font-semibold hover:underline">Log in</a>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/signup.js"></script>

</body>
</html>
