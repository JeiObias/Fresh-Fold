<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Fresh Fold</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Bubble Animation -->
    <style>
        .bubble {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            background: rgba(125, 211, 252, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                inset 0 0 12px rgba(255, 255, 255, 0.35),
                0 0 15px rgba(125, 211, 252, 0.25);
            animation: bubbleFloat linear infinite;
            pointer-events: none;
        }

        @keyframes bubbleFloat {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {
                transform: translateY(-50vh) translateX(25px) scale(1);
            }

            80% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-120vh) translateX(-30px) scale(1.15);
                opacity: 0;
            }
        }

        .bubble-one {
            width: 55px;
            height: 55px;
            left: 5%;
            animation-duration: 14s;
            animation-delay: 1s;
        }

        .bubble-two {
            width: 25px;
            height: 25px;
            left: 15%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .bubble-three {
            width: 80px;
            height: 80px;
            left: 25%;
            animation-duration: 18s;
            animation-delay: 2s;
        }

        .bubble-four {
            width: 35px;
            height: 35px;
            left: 35%;
            animation-duration: 12s;
            animation-delay: 6s;
        }

        .bubble-five {
            width: 65px;
            height: 65px;
            left: 45%;
            animation-duration: 16s;
            animation-delay: 3s;
        }

        .bubble-six {
            width: 28px;
            height: 28px;
            left: 55%;
            animation-duration: 11s;
            animation-delay: 7s;
        }

        .bubble-seven {
            width: 90px;
            height: 90px;
            left: 65%;
            animation-duration: 19s;
            animation-delay: 1s;
        }

        .bubble-eight {
            width: 40px;
            height: 40px;
            left: 75%;
            animation-duration: 13s;
            animation-delay: 5s;
        }

        .bubble-nine {
            width: 70px;
            height: 70px;
            left: 85%;
            animation-duration: 17s;
            animation-delay: 2s;
        }

        .bubble-ten {
            width: 22px;
            height: 22px;
            left: 92%;
            animation-duration: 9s;
            animation-delay: 4s;
        }

        .bubble-eleven {
            width: 45px;
            height: 45px;
            left: 10%;
            animation-duration: 15s;
            animation-delay: 8s;
        }

        .bubble-twelve {
            width: 32px;
            height: 32px;
            left: 30%;
            animation-duration: 11s;
            animation-delay: 5s;
        }

        .bubble-thirteen {
            width: 60px;
            height: 60px;
            left: 60%;
            animation-duration: 16s;
            animation-delay: 9s;
        }

        .bubble-fourteen {
            width: 30px;
            height: 30px;
            left: 80%;
            animation-duration: 12s;
            animation-delay: 6s;
        }

        .bubble-fifteen {
            width: 50px;
            height: 50px;
            left: 50%;
            animation-duration: 14s;
            animation-delay: 10s;
        }
    </style>
</head>


<body class="font-[Poppins] min-h-screen flex items-center justify-center px-5 py-10 overflow-x-hidden relative">


    <!-- Background -->
    <div class="absolute inset-0 -z-30">

        <img
            src="images/washing-machine.jpg"
            alt="Laundry Background"
            class="w-full h-full object-cover">

    </div>


    <!-- Overlay -->
    <div class="absolute inset-0 bg-slate-900/40 -z-20"></div>


    <!-- Floating Bubbles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>
        <div class="bubble bubble-five"></div>
        <div class="bubble bubble-six"></div>
        <div class="bubble bubble-seven"></div>
        <div class="bubble bubble-eight"></div>
        <div class="bubble bubble-nine"></div>
        <div class="bubble bubble-ten"></div>
        <div class="bubble bubble-eleven"></div>
        <div class="bubble bubble-twelve"></div>
        <div class="bubble bubble-thirteen"></div>
        <div class="bubble bubble-fourteen"></div>
        <div class="bubble bubble-fifteen"></div>

    </div>


    <!-- ================= SIGN UP CARD ================= -->

    <div class="relative z-10 w-full max-w-4xl">

        <div
            class="bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl rounded-3xl p-7 md:p-9">


            <!-- Header -->
            <div class="flex flex-col items-center mb-6">

                <!-- Logo -->
                <div
                    class="rounded-full bg-white shadow-xl border-2 border-blue-400 p-1"
                    style="width: 82px; height: 82px;">

                    <img
                        src="images/laundry-logo.png"
                        alt="Laundry Management System Logo"
                        class="w-full h-full object-cover rounded-full">

                </div>


                <h1 class="text-3xl font-bold text-center text-slate-800 mt-4">
                    Create Account
                </h1>

                <p class="text-center text-slate-500 mt-1">
                    Sign up for Fresh Fold.
                </p>

            </div>


            <!-- ================= FORM ================= -->

            <form id="signupForm">

                <!-- Two Columns -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">


                    <!-- LEFT COLUMN -->

                    <div>

                        <!-- Full Name -->
                        <div class="mb-4">

                            <label class="block mb-2 text-slate-700 font-medium">
                                Full Name
                            </label>

                            <div class="relative">

                                <i
                                    class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600">
                                </i>

                                <input
                                    id="fullName"
                                    type="text"
                                    placeholder="Enter your full name"
                                    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

                            </div>

                            <p
                                id="fullNameError"
                                class="text-red-500 text-sm mt-1">
                            </p>

                        </div>


                        <!-- Username -->
                        <div class="mb-4">

                            <label class="block mb-2 text-slate-700 font-medium">
                                Username
                            </label>

                            <div class="relative">

                                <i
                                    class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600">
                                </i>

                                <input
                                    id="username"
                                    type="text"
                                    placeholder="Choose a username"
                                    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

                            </div>

                            <p
                                id="usernameError"
                                class="text-red-500 text-sm mt-1">
                            </p>

                        </div>


                        <!-- Email -->
                        <div class="mb-4">

                            <label class="block mb-2 text-slate-700 font-medium">
                                Email
                            </label>

                            <div class="relative">

                                <i
                                    class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600">
                                </i>

                                <input
                                    id="email"
                                    type="email"
                                    placeholder="Enter your email"
                                    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

                            </div>

                            <p
                                id="emailError"
                                class="text-red-500 text-sm mt-1">
                            </p>

                        </div>

                    </div>


                    <!-- RIGHT COLUMN -->

                    <div>

                        <!-- Password -->
                        <div class="mb-4">

                            <label class="block mb-2 text-slate-700 font-medium">
                                Password
                            </label>

                            <div class="relative">

                                <i
                                    class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600">
                                </i>

                                <input
                                    id="password"
                                    type="password"
                                    placeholder="Create a password"
                                    autocomplete="new-password"
                                    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

                            </div>

                            <p
                                id="passwordError"
                                class="text-red-500 text-sm mt-1">
                            </p>

                        </div>


                        <!-- Confirm Password -->
                        <div class="mb-5">

                            <label class="block mb-2 text-slate-700 font-medium">
                                Confirm Password
                            </label>

                            <div class="relative">

                                <i
                                    class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600">
                                </i>

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    placeholder="Re-enter your password"
                                    autocomplete="new-password"
                                    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

                            </div>

                            <p
                                id="confirmPasswordError"
                                class="text-red-500 text-sm mt-1">
                            </p>

                        </div>


                        <!-- Errors -->
                        <p
                            id="generalError"
                            class="text-red-500 text-sm mb-4">
                        </p>

                        <p
                            id="generalSuccess"
                            class="text-green-600 text-sm mb-4">
                        </p>


                        <!-- Button -->
                        <button
                            id="signupBtn"
                            type="submit"
                            class="w-full py-3 rounded-xl bg-linear-to-r from-cyan-500 to-blue-600 text-white font-semibold hover:scale-[1.02] hover:shadow-xl duration-300">

                            <i class="fa-solid fa-user-plus mr-2"></i>

                            Create Account

                        </button>

                    </div>

                </div>

            </form>


            <!-- Footer -->
            <div class="mt-6 text-center text-slate-600 text-sm">

                Already have an account?

                <a
                    href="index.html"
                    class="text-cyan-600 font-semibold hover:underline">

                    Log in

                </a>

            </div>


        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/signup.js"></script>

    <!-- Loading Screen -->
<div id="loadingScreen"
    class="fixed inset-0 z-9999 hidden items-center justify-center bg-slate-900/70 backdrop-blur-md">

    <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl px-10 py-8 text-center border border-white/60">

        <!-- Spinner -->
        <div class="mx-auto mb-5 w-14 h-14 rounded-full border-4 border-slate-200 border-t-cyan-500 animate-spin"></div>

        <h2 class="text-xl font-bold text-slate-800">
            Creating Account
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Please wait while we create your account...
        </p>

    </div>
</div>

</body>

</html>
