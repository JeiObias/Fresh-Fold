
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fresh Fold</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <!-- Poppins Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="font-[Poppins] dashboard-bg min-h-screen flex flex-col">


    <!-- ===================================================== -->
    <!-- GOVERNMENT TOP BAR -->
    <!-- ===================================================== -->

    <header class="relative z-30 w-full bg-slate-900/95 text-white shadow-lg">

        <div class="w-full px-4 md:px-8 py-3">

            <div class="flex items-center justify-between gap-4">

                <!-- LEFT: REPUBLIC SEAL -->

                <div class="flex items-center gap-3 shrink-0">

                    <div
                        class="rounded-full bg-white p-1 shadow-md"
                        style="width: 60px; height: 60px;">

                        <img
                            src="images/ph.webp"
                            alt="Republic of the Philippines Seal"
                            class="w-full h-full rounded-full object-contain">

                    </div>

                    <div class="hidden sm:block">

                        <p class="text-xs text-white/70">
                            Government of the Philippines
                        </p>

                        <p class="font-semibold text-sm md:text-base">
                            Republic of the Philippines
                        </p>

                    </div>

                </div>


                <!-- RIGHT: TRANSPARENCY SEAL -->

                <div
                    class="rounded-full bg-white p-1 shadow-md shrink-0"
                    style="width: 60px; height: 60px;">

                    <img
                        src="images/ph1.png"
                        alt="Transparency Seal"
                        class="w-full h-full rounded-full object-contain">

                </div>

            </div>

        </div>

    </header>


    <!-- ===================================================== -->
    <!-- EMPTY MAIN CONTENT -->
    <!-- ===================================================== -->

    <main class="flex-1 w-full">

        <!-- Content can be added here later -->

    </main>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer class="w-full">

        <div
            class="bg-slate-900 text-white px-6 md:px-8 py-6">

            <div
                class="flex flex-col md:flex-row items-center justify-between gap-5">


                <!-- FOOTER LOGO -->

                <div class="flex items-center gap-3">

                    <img
                        src="images/ph.webp"
                        alt="Republic of the Philippines Seal"
                        class="w-12 h-12 object-contain">

                    <div>

                        <p class="text-xs text-slate-400">
                            Government Directory
                        </p>

                        <p class="text-sm font-semibold">
                            Government information and directory services.
                        </p>

                    </div>

                </div>


                <!-- COPYRIGHT -->

                <div class="text-center md:text-right">

                    <p class="text-xs text-slate-400">
                        © 2026 Fresh Fold Laundry Management System
                    </p>

                    <p class="text-xs text-slate-500 mt-1">
                        All content is public domain unless otherwise stated.
                    </p>

                </div>

            </div>

        </div>

    </footer>


</body>

</html>
