<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Management System</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="font-[Poppins] min-h-screen flex items-center justify-center px-5 overflow-hidden relative">

    <!-- Background Image -->
    <div class="absolute inset-0 -z-20">
        <img
            src="images/washing-machine.jpg"
            alt="Laundry Background"
            class="w-full h-full object-cover">
    </div>

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-slate-900/40 -z-10"></div>

    <!-- Floating Bubbles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>
        <div class="bubble bubble-five"></div>
        <div class="bubble bubble-six"></div>
        <div class="bubble bubble-seven"></div>
        <div class="bubble bubble-eight"></div>
        <div class="bubble bubble-nine"></div>
        <div class="bubble bubble-ten"></div>
        <div class="bubble bubble-eleven"></div>
        <div class="bubble bubble-twelve"></div>
        <div class="bubble bubble-thirteen"></div>
        <div class="bubble bubble-fourteen"></div>
        <div class="bubble bubble-fifteen"></div>

    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md">
        

        <div class="bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl rounded-3xl p-8">

         <!-- Logo -->
<div class="flex justify-center mb-6">

    <div class="w-28 h-28 rounded-full bg-white p-2 shadow-2xl border-4 border-blue-400">

        <img
            src="images/laundry-logo.jpg"
            alt="Laundry Management System Logo"
            class="w-full h-full rounded-full object-cover">

    </div>

</div>
            <h1 class="text-3xl font-bold text-center text-slate-800">
                Fresh Fold
            </h1>
         
            <p class="text-center text-slate-500 mt-2 mb-8">
                Please login.
            </p>

           <form id="loginForm">

                <!-- Username -->

                <div class="mb-5">

                    <label class="block mb-2 text-slate-700 font-medium">
                        Username
                    </label>

                    <div class="relative">

                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>

                       <input
    id="username"
    type="text"
    placeholder="Enter username"
    class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">

<p id="usernameError" class="text-red-500 text-sm mt-2"></p>
                    </div>

                </div>
<!-- Password -->

<div class="mb-3">

    <label class="block mb-2 text-slate-700 font-medium">
        Password
    </label>

    <div class="relative">

        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>


        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            class="w-full pl-12 pr-12 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">


        <span
            id="togglePassword"
            class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-slate-500 hover:text-cyan-600 transition">

            <i id="eyeIcon" class="fa-solid fa-eye"></i>

        </span>


    </div>

    <p id="passwordError" class="text-red-500 text-sm"></p>


</div>
                <!-- Button -->

               <button
    id="loginBtn"
    type="submit"
    class="w-full py-3 rounded-xl bg-linear-to-r from-cyan-500 to-blue-600 text-white font-semibold hover:scale-105 hover:shadow-xl duration-300">

    Login

</button>

            </form>

            <!-- Sign up link -->
            <div class="mt-6 text-center text-slate-600 text-sm">
                Don't have an account?
                <a href="signup.html" class="text-cyan-600 font-semibold hover:underline">Sign up</a>
            </div>

            <!-- Footer -->

            <div class="mt-8 text-center text-slate-500 text-sm">

                © 2026 Laundry Management System

            </div>

        </div>

    </div>

    <!-- Supabase client library (must load BEFORE supabase.js and script.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
