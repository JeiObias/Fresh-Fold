<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Fresh Fold</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="font-[Poppins] min-h-screen flex items-center justify-center px-5 bg-slate-100">

    <div class="relative z-10 w-full max-w-md">

        <div class="bg-white shadow-2xl rounded-3xl p-8">

            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-full bg-cyan-50 flex items-center justify-center border-4 border-cyan-400">
                    <i class="fa-solid fa-key text-3xl text-cyan-600"></i>
                </div>
            </div>

            <h1 class="text-2xl font-bold text-center text-slate-800">
                Set a New Password
            </h1>

            <p class="text-center text-slate-500 mt-2 mb-8">
                This is your first login. Please choose a new password before continuing.
            </p>

            <form id="changePasswordForm">

                <!-- New Password -->
                <div class="mb-5">
                    <label class="block mb-2 text-slate-700 font-medium">
                        New Password
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="newPassword"
                            type="password"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="newPasswordError" class="text-red-500 text-sm mt-2"></p>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="block mb-2 text-slate-700 font-medium">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-cyan-600"></i>
                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-4 focus:ring-cyan-200 focus:border-cyan-500 outline-none transition">
                    </div>
                    <p id="confirmPasswordError" class="text-red-500 text-sm"></p>
                </div>

                <p id="generalError" class="text-red-500 text-sm mb-4"></p>

                <button
                    id="changePasswordBtn"
                    type="submit"
                    class="w-full py-3 rounded-xl bg-linear-to-r from-cyan-500 to-blue-600 text-white font-semibold hover:scale-105 hover:shadow-xl duration-300">
                    Save New Password
                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/change-password.js"></script>

</body>
</html>
